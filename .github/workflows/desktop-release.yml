name: desktop-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            jobs: linux-deb,linux-rpm,linux-appimage
          - os: windows-2022
            target: windows
            jobs: windows-zip
          - os: macos-latest
            target: macos
            jobs: macos-dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable

      - name: Install Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libblkid-dev \
            libmpv-dev mpv \
            rpm patchelf \
            libfuse2t64 \
            wget ca-certificates

      - name: Install appimagetool (Linux)
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          sudo install -d /usr/local/bin
          sudo wget -q -O /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Configure rpmbuild for fastforge (Linux)
        if: matrix.target == 'linux'
        run: |
          mkdir -p "$RUNNER_TEMP/rpmdb" "$RUNNER_TEMP/rpmbuild-bin"
          rpm --initdb --dbpath "$RUNNER_TEMP/rpmdb"
          cat << 'EOF' > "$RUNNER_TEMP/rpmbuild-bin/rpmbuild"
          #!/bin/bash
          set -euo pipefail
          exec /usr/bin/rpmbuild "$@" --nodeps --dbpath "$RUNNER_TEMP/rpmdb"
          EOF
          chmod +x "$RUNNER_TEMP/rpmbuild-bin/rpmbuild"
          echo "$RUNNER_TEMP/rpmbuild-bin" >> "$GITHUB_PATH"

      - name: Generate AppImage make_config
        if: matrix.target == 'linux'
        run: ./linux/packaging/appimage/generate_make_config.sh

      - name: Use committed locate shim for AppImage
        if: matrix.target == 'linux'
        run: echo "$PWD/linux/packaging/appimage/bin" >> $GITHUB_PATH

      - name: Install macOS packaging deps
        if: matrix.target == 'macos'
        run: npm install -g appdmg

      - run: flutter pub get

      - run: dart pub global activate fastforge 0.6.12

      - name: Ensure pub global bin on PATH (Unix)
        if: matrix.target != 'windows'
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Ensure pub global bin on PATH (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: echo "$env:LOCALAPPDATA\Pub\Cache\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - run: fastforge release --name stable --jobs ${{ matrix.jobs }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
            dist/**/*.zip
            dist/**/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
