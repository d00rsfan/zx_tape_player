name: Google Play

# Disabled: auto-deploy on GitHub release is paused. Re-enable by restoring
# the `release:` trigger below alongside `workflow_dispatch:`.
on:
  workflow_dispatch:

jobs:
    deploy:
      name: Build Release
      runs-on: ubuntu-latest

      steps:
        - name: "Check Beta"
          if: github.event.release.prerelease == true
          run: echo "LANE=beta" >> $GITHUB_ENV

        - name: "Check Production"
          if: github.event.release.prerelease != true
          run: echo "LANE=production" >> $GITHUB_ENV

        - name: Checkout
          uses: actions/checkout@v7
          with:
            ref: ${{ steps.latest.outputs.tag_name }}

        - name: Setup Java
          uses: actions/setup-java@v5
          with:
            distribution: temurin
            java-version: '21'

        - uses: subosito/flutter-action@v2
          with:
            channel: 'stable'

        - name: Download pub dependencies
          run: flutter pub get

        - name: Run analyzer
          run: flutter analyze

        - name: Download Android keystore
          id: android_keystore
          uses: timheuer/base64-to-file@v2
          with:
            fileName: key.jks
            encodedString: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

        - name: Create key.properties
          run: |
            echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > android/key.properties
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties

        - name: Build Android App
          run: flutter build appbundle --release --no-pub

        - name: Update Android Changelog
          run: echo "${{ github.event.release.body }}" > android/fastlane/metadata/android/en-US/changelogs/default.txt

        - name: Publish Android
          uses: maierj/fastlane-action@v3.2.0
          with:
            lane: '$LANE'
            subdirectory: 'android'
            bundle-install-path: 'vendor/bundle'
          env:
            SUPPLY_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
            SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
