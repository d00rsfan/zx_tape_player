allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Project.buildDir was removed in Gradle 9 — route the shared ../build
// directory through layout.buildDirectory instead (mirrors the Flutter
// 3.44 app template).
def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    def newSubprojectBuildDir = newBuildDir.dir(project.name)
    project.layout.buildDirectory.value(newSubprojectBuildDir)
}
subprojects {
    project.evaluationDependsOn(":app")
}

// media_store_plus 0.1.3 (latest published) still compiles against
// android-33, while current androidx AAR metadata demands compileSdk ≥ 34.
// Lift just that subproject to the app's compileSdk until the plugin
// updates upstream.
subprojects {
    if (project.name == 'media_store_plus') {
        afterEvaluate {
            project.android.compileSdk = 36
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
