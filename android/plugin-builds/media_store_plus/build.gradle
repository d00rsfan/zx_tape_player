group = "com.snnafi.media_store_plus"
version = "1.0-SNAPSHOT"

apply plugin: "com.android.library"

def upstreamAndroidDir = gradle.ext.zxTapePlayerPluginAndroidDirs[project.name]

android {
    namespace = "com.snnafi.media_store_plus"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile new File(upstreamAndroidDir, "src/main/AndroidManifest.xml")
            java.srcDirs += new File(upstreamAndroidDir, "src/main/kotlin")
        }
    }

    defaultConfig {
        minSdk = 16
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation("androidx.documentfile:documentfile:1.0.1")
    implementation("com.google.code.gson:gson:2.9.0")
}
