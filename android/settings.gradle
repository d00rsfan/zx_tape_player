pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.0.1" apply false
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
}

include ":app"

// These two plugins are already at their latest hosted releases, but their
// Android build files still apply the legacy Kotlin Gradle Plugin. Point only
// their Android subprojects at local build descriptors until upstream ships
// built-in Kotlin support; Dart and native source stay in the pub cache.
gradle.ext.zxTapePlayerPluginAndroidDirs = [:]
[
    "in_app_review",
    "media_store_plus",
].each { pluginName ->
    def pluginProject = findProject(":${pluginName}")
    if (pluginProject == null) {
        throw new GradleException("Flutter plugin project not found: ${pluginName}")
    }

    gradle.ext.zxTapePlayerPluginAndroidDirs[pluginName] = pluginProject.projectDir
    pluginProject.projectDir = file("plugin-builds/${pluginName}")
}
