name: zx_tape_player
description: ZX Tape Player sends Spectrum TAP/TZX, ZX81 P/81/P81, and ZX80 O/80 tape images to compatible real computers as audio.

publish_to: 'none'

version: 1.6.0+11

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_typeahead: ^6.0.0
  package_info_plus: ^10.2.1
  http: ^1.6.0
  easy_localization: ^3.0.8
  # Upstream's BitmapFactory downsampling fix is not published yet. Pin the
  # exact 12.0.0-beta.8 commit until it is available as a hosted release.
  file_picker:
    git:
      url: https://github.com/miguelpruivo/flutter_file_picker.git
      ref: 34c682373ba7410c148f3aa019aa9551a245b5a8
  cached_network_image: ^3.4.1
  pull_to_refresh_flutter3: ^2.0.2
  carousel_slider: ^5.0.0
  just_audio: ^0.10.5
  flutter_spinkit: ^5.2.1
  rxdart: ^0.28.0
  crypto: ^3.0.7
  get_it: ^9.0.0
  url_launcher: ^6.3.2
  marquee_widget: ^1.2.0
  archive: ^4.0.9
  zx_tape_to_wav_x: ^1.3.1
  # Community-maintained successor of the discontinued sound_mode (pub.dev
  # replacedBy). Same SoundMode/RingerModeStatus API.
  sound_mode_advanced: ^4.0.0
  shared_preferences: ^2.5.5
  internet_connection_checker: ^3.0.1
  wakelock_plus: ^1.7.0
  volume_controller: ^3.4.4
  share_plus: ^13.3.0
  # The Android build descriptors for these latest hosted releases are
  # migrated locally under android/plugin-builds until upstream publishes the
  # same Built-in Kotlin changes.
  in_app_review: ^2.0.12
  # Android-only: save downloaded tapes into the public Downloads/ZX Tape Player
  # folder via MediaStore. Self-disables on iOS/desktop.
  media_store_plus: ^0.1.3
  # Used only on Android API ≤ 29, where media_store_plus falls back to direct
  # File I/O against /storage/emulated/0/Download/… and needs the legacy
  # WRITE_EXTERNAL_STORAGE permission. The Dart import compiles on all
  # platforms; the call is gated by Platform.isAndroid and sdkInt < 30.
  permission_handler: ^12.0.1
  # Linux/Windows audio backend (libmpv via media_kit). No-op on Android/iOS.
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9

dependency_overrides:
  # Fork with AVAudioTimePitchAlgorithmVarispeed on iOS/macOS so playback
  # speed also scales pitch (tape-recorder semantics). Combined with an
  # explicit setPitch(speed) on Android, both platforms behave alike.
  # Pinned to a SHA for reproducible builds; revert once upstream merges.
  just_audio:
    git:
      url: https://github.com/d00rsfan/just_audio.git
      ref: 0c0cf436811ed196064380120b484efbbed71d91
      path: just_audio

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.5
  build_runner: ^2.4.14

flutter_icons:
  android: true
  ios: true
  image_path_ios: "assets/icons/launcher/ios.png"
  image_path_android: "assets/icons/launcher/android.png"
  adaptive_icon_foreground: "assets/icons/launcher/android-foreground.png"
  adaptive_icon_background: "assets/icons/launcher/android-background.png"

flutter_native_splash:
  color: "#546B7F"
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash/logo.png
    - assets/images/splash/spool.png
    - assets/images/home/search-icon.png
    - assets/translations/
    - assets/sounds/empty.wav
    - assets/snapshots/

  fonts:
    - family: ZxSpectrum
      fonts:
        - asset: assets/fonts/zx_spectrum-7.ttf
